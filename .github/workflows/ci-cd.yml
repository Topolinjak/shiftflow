name: CI/CD

on:
  pull_request:
  push:
    branches: [main]

# Ob novem pushu v PR prekliči še tekoči zagon. Zagonov na main ne prekinjamo,
# da se deploy ne ustavi sredi nameščanja (počakajo v vrsti).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NODE_VERSION: "26"

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci --ignore-scripts

      - name: Lint backend
        working-directory: backend
        run: npm run lint

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      # Frontend: URL backenda se ob gradnji vgradi iz okoljske spremenljivke
      # (repozitorijska spremenljivka VITE_API_URL; prazna = relativne poti /api).
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: npm run build

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: error
          retention-days: 7

      # Backend: Prisma Client ni v gitu, zato ga generiramo pred prevajanjem.
      # DATABASE_URL je tu le navidezna vrednost (generate se ne poveže z bazo).
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci --ignore-scripts

      - name: Generate Prisma Client
        working-directory: backend
        env:
          DATABASE_URL: postgresql://build:build@localhost:5432/build
        run: npx prisma generate

      - name: Build backend
        working-directory: backend
        run: npm run build

      # Paket za deploy: prevedena koda + datoteke za namestitev odvisnosti in migracije.
      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-package
          path: |
            backend/dist
            backend/prisma
            backend/prisma.config.ts
            backend/package.json
            backend/package-lock.json
          if-no-files-found: error
          retention-days: 7

  test:
    name: test
    runs-on: ubuntu-latest

    # Backend testi so integracijski (Express + Prisma) in potrebujejo pravo
    # bazo PostgreSQL, zato jo zaženemo kot servisni kontejner.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: shiftflow
          POSTGRES_PASSWORD: shiftflow
          POSTGRES_DB: shiftflow_api_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shiftflow -d shiftflow_api_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # Samo testne vrednosti za CI (niso produkcijske skrivnosti).
    # scripts/test.cjs ime baze v DATABASE_URL zamenja s shiftflow_api_test.
    env:
      DATABASE_URL: postgresql://shiftflow:shiftflow@localhost:5432/shiftflow?schema=public
      SEED_PASSWORD: ci-test-password-123
      JWT_SECRET: ci-test-jwt-secret-that-is-at-least-32-chars

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Test frontend (Vitest + coverage)
        working-directory: frontend
        run: npm run test:coverage

      - name: Upload frontend coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage
          retention-days: 7

      # Namestitvene skripte (bcrypt, prisma) so dovoljene v allowScripts v package.json.
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Generate Prisma Client
        working-directory: backend
        run: npx prisma generate

      - name: Test backend (migracije + seed + node:test + coverage)
        working-directory: backend
        run: npm run test:coverage

      - name: Upload backend coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage
          retention-days: 7

  deploy:
    name: deploy
    needs: [lint, build, test]
    # Samo ob pushu na main (tudi merge PR-ja), nikoli ob pull_request.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    # Skrivnosti so shranjene v okolju production (Settings → Environments).
    environment:
      name: production
      url: ${{ vars.FRONTEND_URL }}

    # Brez checkouta: nameščamo izključno artefakte iz joba build.
    steps:
      - name: Download backend artifact
        uses: actions/download-artifact@v5
        with:
          name: backend-package
          path: backend-package

      - name: Download frontend artifact
        uses: actions/download-artifact@v5
        with:
          name: frontend-dist
          path: frontend-dist

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend-package/package-lock.json

      # Samo produkcijske odvisnosti (koda je že prevedena v dist/).
      - name: Install backend production dependencies
        working-directory: backend-package
        run: npm ci --omit=dev

      - name: Apply database migrations
        working-directory: backend-package
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx prisma migrate deploy

      - name: Deploy backend to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: backend-package

      # Netlify CLI samo naloži že zgrajeni dist (brez ponovnega builda).
      - name: Deploy frontend to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: >-
          npx --yes netlify-cli@27.20.1 deploy
          --prod
          --no-build
          --dir frontend-dist
          --message "GitHub Actions ${{ github.sha }}"

      # App Service se po namestitvi ponovno zažene, zato nekaj časa ponavljamo.
      - name: Smoke test backend
        run: >-
          curl --fail --silent --show-error
          --retry 12 --retry-delay 10 --retry-all-errors
          "${{ vars.VITE_API_URL }}/api/health"
